<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍕 Pizza des Tontons</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0a06; --surface: #1a1108; --card: #221608;
    --border: rgba(230,180,80,0.15); --orange: #E67E22;
    --orange-light: #f39c4a; --orange-dim: rgba(230,126,34,0.12);
    --cream: #FFF8EE; --muted: rgba(255,248,238,0.45);
    --red: #e74c3c; --green: #27AE60; --yellow: #f1c40f;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--cream); min-height: 100vh; max-width: 480px; margin: 0 auto; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; position: sticky; top: 0; z-index: 10; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
  .brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; }
  .brand span { color: var(--orange); }
  .header-stats { display: flex; gap: 10px; }
  .stat-pill { background: var(--orange-dim); border: 1px solid rgba(230,126,34,0.3); color: var(--orange-light); font-size: 0.62rem; letter-spacing: 0.06em; padding: 3px 10px; border-radius: 999px; }
  .stat-pill.green { background: rgba(39,174,96,0.12); border-color: rgba(39,174,96,0.3); color: #2ecc71; }

  /* STOCK BAR */
  .stock-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 1rem 1.25rem 0; }
  .stock-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.75rem; text-align: center; transition: border-color 0.2s; }
  .stock-card.warning { border-color: var(--yellow); }
  .stock-card.empty { border-color: var(--red); opacity: 0.6; }
  .stock-name { font-size: 0.58rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
  .stock-count { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--cream); line-height: 1; }
  .stock-card.warning .stock-count { color: var(--yellow); }
  .stock-card.empty .stock-count { color: var(--red); }
  .stock-price { font-size: 0.6rem; color: var(--muted); margin-top: 1px; }

  /* FORM */
  .form-wrap { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; }
  .field-group { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 0.58rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--orange); display: flex; align-items: center; gap: 6px; }
  .field-label.required::after { content: '●'; color: var(--red); font-size: 0.45rem; }
  .field-label .optional { color: var(--muted); font-size: 0.55rem; text-transform: none; letter-spacing: 0; }

  input[type=text], input[type=tel] { background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--cream); font-family: 'DM Mono', monospace; font-size: 0.88rem; padding: 0.7rem 1rem; width: 100%; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  input[type=text]:focus, input[type=tel]:focus { border-color: var(--orange); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

  /* PIZZA PICKER */
  .pizza-grid { display: flex; flex-direction: column; gap: 8px; }
  .pizza-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: var(--muted); font-family: 'DM Mono', monospace;
    padding: 0.75rem 1rem; cursor: pointer;
    display: grid; grid-template-columns: 24px 1fr auto auto;
    align-items: center; gap: 10px;
    transition: all 0.15s; user-select: none;
  }
  .pizza-btn.selected { background: var(--orange-dim); border-color: var(--orange); color: var(--cream); }
  .pizza-btn.out { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .pizza-btn .check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,248,238,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.7rem; transition: all 0.15s; }
  .pizza-btn.selected .check { background: var(--orange); border-color: var(--orange); color: white; }
  .pizza-btn-name { font-size: 0.88rem; text-align: left; }
  .pizza-btn-stock { font-size: 0.62rem; color: var(--muted); text-align: right; }
  .pizza-btn-stock.warn { color: var(--yellow); }
  .pizza-btn-stock.out { color: var(--red); }
  .pizza-btn-price { font-size: 0.78rem; color: var(--orange-light); font-weight: 500; }

  /* QUANTITE */
  .qty-row { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 1rem; margin-top: -4px; display: none; }
  .qty-row.show { display: flex; }
  .qty-label { font-size: 0.75rem; color: var(--muted); }
  .qty-controls { display: flex; align-items: center; gap: 12px; }
  .qty-btn { background: var(--orange-dim); border: 1px solid rgba(230,126,34,0.3); color: var(--orange-light); width: 28px; height: 28px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .qty-btn:hover { background: var(--orange); color: white; border-color: var(--orange); }
  .qty-val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; min-width: 20px; text-align: center; }

  /* TOTAL */
  .total-box { background: var(--surface); border: 1px solid var(--orange); border-radius: 12px; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; }
  .total-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .total-amount { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--orange); }

  /* ALLERGIE */
  .allergy-toggle { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 1rem; cursor: pointer; }
  .allergy-toggle span { font-size: 0.8rem; color: var(--muted); }
  .toggle-switch { width: 38px; height: 20px; background: rgba(255,255,255,0.08); border-radius: 999px; position: relative; transition: background 0.2s; flex-shrink: 0; }
  .toggle-switch.on { background: var(--red); }
  .toggle-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform 0.2s; }
  .toggle-switch.on .toggle-knob { transform: translateX(18px); }
  .allergy-field { display: none; margin-top: 6px; }
  .allergy-field.show { display: block; }
  .allergy-warn { font-size: 0.62rem; color: var(--red); margin-top: 4px; }

  /* PAIEMENT */
  .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pay-option { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem; cursor: pointer; text-align: center; font-size: 0.8rem; transition: all 0.2s; user-select: none; }
  .pay-option.selected { border-color: var(--orange); background: var(--orange-dim); color: var(--orange-light); }

  .submit-btn { background: var(--orange); color: white; border: none; border-radius: var(--radius); font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; padding: 1rem; width: 100%; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .submit-btn:hover { background: var(--orange-light); }
  .submit-btn:active { transform: scale(0.98); }

  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--green); color: white; font-family: 'DM Mono', monospace; font-size: 0.75rem; padding: 0.75rem 1.25rem; border-radius: 999px; opacity: 0; transition: opacity 0.3s; white-space: nowrap; z-index: 100; pointer-events: none; }
  .toast.error { background: var(--red); }
  .toast.warn { background: var(--yellow); color: #333; }
  .toast.show { opacity: 1; }

  /* CONFIRM */
  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; align-items: flex-end; justify-content: center; }
  .confirm-overlay.show { display: flex; }
  .confirm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; padding: 1.5rem 1.25rem 2rem; width: 100%; max-width: 480px; }
  .confirm-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; margin-bottom: 1rem; }
  .confirm-num { color: var(--orange); }
  .confirm-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.78rem; }
  .confirm-row:last-of-type { border-bottom: none; }
  .confirm-key { color: var(--muted); }
  .confirm-val { color: var(--cream); text-align: right; max-width: 65%; }
  .confirm-total { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--orange); font-size: 1rem; }
  .confirm-allergy { color: var(--red); }
  .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 1.25rem; }
  .btn-cancel { background: none; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.8rem; padding: 0.8rem; cursor: pointer; }
  .btn-confirm { background: var(--orange); border: none; border-radius: 10px; color: white; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem; padding: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-confirm:disabled { background: rgba(230,126,34,0.3); cursor: not-allowed; }

  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .spinner.show { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* HISTORIQUE */
  .divider { height: 1px; background: var(--border); margin: 0.5rem 1.25rem 0; }
  .history-section { padding: 0 1.25rem 2rem; }
  .history-title { font-size: 0.58rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; padding-top: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
  .history-total { color: var(--orange-light); }
  .history-item { display: flex; align-items: center; justify-content: space-between; padding: 0.55rem 0; border-bottom: 1px solid var(--border); font-size: 0.7rem; gap: 6px; }
  .history-item:last-child { border-bottom: none; }
  .h-left { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; }
  .h-num { color: var(--orange); font-weight: 500; flex-shrink: 0; }
  .h-name { color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-allergy { color: var(--red); font-size: 0.6rem; flex-shrink: 0; }
  .h-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .h-amount { color: var(--orange-light); font-size: 0.68rem; }
  .h-time { color: var(--muted); font-size: 0.62rem; }
  .sms-btn { background: var(--orange-dim); border: 1px solid rgba(230,126,34,0.3); color: var(--orange-light); border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 0.58rem; padding: 2px 7px; cursor: pointer; transition: all 0.2s; }
  .sms-btn:hover { background: var(--orange); color: white; border-color: var(--orange); }
  .sms-btn.no-phone { opacity: 0.2; cursor: default; pointer-events: none; }

  .reset-btn { display: block; margin: 0.5rem 1.25rem 2rem; background: none; border: 1px dashed rgba(231,76,60,0.3); border-radius: 10px; color: rgba(231,76,60,0.5); font-family: 'DM Mono', monospace; font-size: 0.65rem; padding: 0.6rem; cursor: pointer; width: calc(100% - 2.5rem); text-align: center; transition: all 0.2s; }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="brand">🍕 Pizza <span>des Tontons</span></div>
    <div class="header-stats">
      <div class="stat-pill" id="cmd-count">0 cmd</div>
      <div class="stat-pill green" id="ca-total">0 €</div>
    </div>
  </div>
</div>

<div class="stock-bar" id="stock-bar"></div>

<div class="form-wrap">

  <div class="row2">
    <div class="field-group">
      <label class="field-label required">Nom client</label>
      <input type="text" id="nom" placeholder="Sophie" autocomplete="off" autocorrect="off">
    </div>
    <div class="field-group">
      <label class="field-label required">Heure</label>
      <input type="text" id="heure" placeholder="13h12" autocomplete="off">
    </div>
  </div>

  <div class="field-group">
    <label class="field-label">Téléphone <span class="optional">(optionnel)</span></label>
    <input type="tel" id="telephone" placeholder="06 12 34 56 78" autocomplete="off">
  </div>

  <div class="field-group">
    <label class="field-label required">Pizzas</label>
    <div class="pizza-grid" id="pizza-grid"></div>
  </div>

  <div class="total-box">
    <div class="total-label">Total commande</div>
    <div class="total-amount" id="total-display">0 €</div>
  </div>

  <div class="field-group">
    <label class="field-label">Allergie / SANS</label>
    <div class="allergy-toggle" onclick="toggleAllergy()">
      <span id="allergy-toggle-label">Aucune allergie</span>
      <div class="toggle-switch" id="allergy-switch"><div class="toggle-knob"></div></div>
    </div>
    <div class="allergy-field" id="allergy-field">
      <input type="text" id="allergie" placeholder="ex. SANS anchois, SANS gluten…" autocomplete="off" autocorrect="off">
      <div class="allergy-warn">⚠️ Pense à le dire à voix haute vers la cuisine !</div>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label required">Paiement</label>
    <div class="pay-options">
      <div class="pay-option selected" id="pay-cb" onclick="selectPay('CB')">💳 CB</div>
      <div class="pay-option" id="pay-esp" onclick="selectPay('Espèces')">💶 Espèces</div>
    </div>
  </div>

  <button class="submit-btn" onclick="showConfirm()">Envoyer sur Trello →</button>
</div>

<div class="divider"></div>
<div class="history-section">
  <div class="history-title">
    <span>Commandes du service</span>
    <span class="history-total" id="history-total">0 €</span>
  </div>
  <div id="history-list"><div style="font-size:0.7rem;color:var(--muted);padding:0.5rem 0;">Aucune commande pour l'instant.</div></div>
</div>
<button class="reset-btn" onclick="resetService()">Réinitialiser le service</button>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-card">
    <div class="confirm-title">Commande <span class="confirm-num" id="c-num">#001</span></div>
    <div id="confirm-details"></div>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">Corriger</button>
      <button class="btn-confirm" id="btn-send" onclick="sendToTrello()">
        <span id="send-label">Envoyer</span>
        <div class="spinner" id="send-spinner"></div>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_KEY  = 'cd1e6513188a9fd49831516bb1ac3027';
const TOKEN    = 'ATTAd5cfbdb0e3e8ad4485cd4f927ce34ee25561105d74a2c9f79aab8ecc564e6078C16D828F';
const BOARD_ID = 'h0s5eobj';

const MENU = [
  { name: 'Margherita', price: 12, stock: 60, initial: 60 },
  { name: 'Diavola',    price: 14, stock: 20, initial: 20 },
  { name: 'Salciccia',  price: 15, stock: 40, initial: 40 },
];

let orderCount = 0;
let totalCA = 0;
let historyList = [];
let paiement = 'CB';
let allergyOn = false;
let targetListId = null;
// qty[i] = nombre de pizzas de type i dans la commande en cours
let qty = MENU.map(() => 0);

// ---- STOCK BAR ----
function renderStockBar() {
  const bar = document.getElementById('stock-bar');
  bar.innerHTML = MENU.map((p, i) => {
    const pct = p.stock / p.initial;
    const cls = p.stock === 0 ? 'empty' : p.stock <= 5 ? 'warning' : '';
    return `<div class="stock-card ${cls}">
      <div class="stock-name">${p.name}</div>
      <div class="stock-count">${p.stock}</div>
      <div class="stock-price">${p.price}€</div>
    </div>`;
  }).join('');
}

// ---- PIZZA GRID ----
function renderGrid() {
  const grid = document.getElementById('pizza-grid');
  grid.innerHTML = MENU.map((p, i) => {
    const isSelected = qty[i] > 0;
    const isOut = p.stock === 0;
    const stockCls = p.stock <= 5 && p.stock > 0 ? 'warn' : p.stock === 0 ? 'out' : '';
    const stockTxt = p.stock === 0 ? 'épuisée' : `reste ${p.stock}`;
    return `
      <button class="pizza-btn ${isSelected ? 'selected' : ''} ${isOut ? 'out' : ''}" onclick="togglePizza(${i})">
        <div class="check">${isSelected ? '✓' : ''}</div>
        <span class="pizza-btn-name">${p.name}</span>
        <span class="pizza-btn-stock ${stockCls}">${stockTxt}</span>
        <span class="pizza-btn-price">${p.price}€</span>
      </button>
      <div class="qty-row ${isSelected ? 'show' : ''}" id="qty-row-${i}">
        <span class="qty-label">Quantité ${p.name}</span>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
          <span class="qty-val" id="qty-val-${i}">${qty[i]}</span>
          <button class="qty-btn" onclick="changeQty(${i}, +1)">+</button>
        </div>
      </div>
    `;
  }).join('');
  updateTotal();
}

function togglePizza(i) {
  if (MENU[i].stock === 0) return;
  if (qty[i] > 0) { qty[i] = 0; } else { qty[i] = 1; }
  renderGrid();
}

function changeQty(i, delta) {
  const newQty = qty[i] + delta;
  if (newQty < 1) { qty[i] = 0; renderGrid(); return; }
  if (newQty > MENU[i].stock) { showToast(`Plus que ${MENU[i].stock} ${MENU[i].name} dispo !`, false, true); return; }
  qty[i] = newQty;
  const el = document.getElementById(`qty-val-${i}`);
  if (el) el.textContent = qty[i];
  updateTotal();
}

function updateTotal() {
  const total = qty.reduce((sum, q, i) => sum + q * MENU[i].price, 0);
  document.getElementById('total-display').textContent = total + ' €';
}

function getTotal() {
  return qty.reduce((sum, q, i) => sum + q * MENU[i].price, 0);
}

function getSelectedPizzas() {
  return qty.map((q, i) => q > 0 ? { name: MENU[i].name, qty: q, price: MENU[i].price } : null).filter(Boolean);
}

// ---- HEURE AUTO ----
function getNow() {
  const n = new Date();
  return `${String(n.getHours()).padStart(2,'0')}h${String(n.getMinutes()).padStart(2,'0')}`;
}
document.getElementById('heure').value = getNow();

// ---- PAIEMENT ----
function selectPay(val) {
  paiement = val;
  document.getElementById('pay-cb').classList.toggle('selected', val === 'CB');
  document.getElementById('pay-esp').classList.toggle('selected', val === 'Espèces');
}

// ---- ALLERGIE ----
function toggleAllergy() {
  allergyOn = !allergyOn;
  document.getElementById('allergy-switch').classList.toggle('on', allergyOn);
  document.getElementById('allergy-field').classList.toggle('show', allergyOn);
  document.getElementById('allergy-toggle-label').textContent = allergyOn ? '⚠️ Allergie notée' : 'Aucune allergie';
  if (allergyOn) document.getElementById('allergie').focus();
}

// ---- FORM DATA ----
function getFormData() {
  return {
    nom: document.getElementById('nom').value.trim(),
    heure: document.getElementById('heure').value.trim(),
    telephone: document.getElementById('telephone').value.trim(),
    allergie: allergyOn ? document.getElementById('allergie').value.trim() : '',
    pizzas: getSelectedPizzas(),
    total: getTotal(),
    paiement
  };
}

function getNextNum() { return String(orderCount + 1).padStart(3, '0'); }

function buildTitre(d, num) {
  const pizzaEmoji = d.pizzas.map(p => '🍕'.repeat(Math.min(p.qty, 3))).join('');
  const pizzaNames = d.pizzas.map(p => p.qty > 1 ? `${p.qty}x${p.name}` : p.name).join('+');
  const allergyFlag = d.allergie ? ' ⚠️' : '';
  return `${pizzaEmoji} ${pizzaNames} · #${num} · ${d.nom} — ${d.heure}${allergyFlag}`;
}

// ---- CONFIRM ----
function showConfirm() {
  const d = getFormData();
  if (!d.nom) { showToast('Indique le nom du client', false, true); return; }
  if (!d.pizzas.length) { showToast('Sélectionne au moins une pizza', false, true); return; }

  const num = getNextNum();
  document.getElementById('c-num').textContent = '#' + num;
  let html = `<div class="confirm-row"><span class="confirm-key">Client</span><span class="confirm-val">${d.nom}</span></div>`;
  html += `<div class="confirm-row"><span class="confirm-key">Heure</span><span class="confirm-val">${d.heure}</span></div>`;
  if (d.telephone) html += `<div class="confirm-row"><span class="confirm-key">Tél.</span><span class="confirm-val">${d.telephone}</span></div>`;
  html += `<div class="confirm-row"><span class="confirm-key">Pizza(s)</span><span class="confirm-val">${d.pizzas.map(p => `${p.qty > 1 ? p.qty+'× ' : ''}${p.name} — ${p.qty * p.price}€`).join('<br>')}</span></div>`;
  html += `<div class="confirm-row"><span class="confirm-key">Paiement</span><span class="confirm-val">${d.paiement}</span></div>`;
  if (d.allergie) html += `<div class="confirm-row"><span class="confirm-key">Allergie</span><span class="confirm-val confirm-allergy">⚠️ ${d.allergie}</span></div>`;
  html += `<div class="confirm-row"><span class="confirm-key">Total</span><span class="confirm-val confirm-total">${d.total} €</span></div>`;
  document.getElementById('confirm-details').innerHTML = html;
  document.getElementById('confirm-overlay').classList.add('show');
}

function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('show'); }

// ---- TRELLO ----
async function findList() {
  try {
    const r = await fetch(`https://api.trello.com/1/boards/${BOARD_ID}/lists?key=${API_KEY}&token=${TOKEN}`);
    const lists = await r.json();
    const t = lists.find(l => l.name.toLowerCase().includes('commande') || l.name.toLowerCase().includes('prendre') || l.name.toLowerCase().includes('entrante'));
    targetListId = t ? t.id : (lists[0] ? lists[0].id : null);
  } catch(e) {}
}
findList();

async function sendToTrello() {
  const d = getFormData();
  const num = getNextNum();
  const btn = document.getElementById('btn-send');
  const lbl = document.getElementById('send-label');
  const spn = document.getElementById('send-spinner');
  btn.disabled = true; lbl.style.display = 'none'; spn.classList.add('show');

  const titre = buildTitre(d, num);
  let desc = `🍕 *Pizzas :*\n${d.pizzas.map(p => `• ${p.qty > 1 ? p.qty+'× ' : ''}${p.name} (${p.qty * p.price}€)`).join('\n')}`;
  desc += `\n\n💳 *Paiement :* ${d.paiement}\n💰 *Total :* ${d.total}€`;
  if (d.telephone) desc += `\n📱 *Téléphone :* ${d.telephone}`;
  if (d.allergie) desc += `\n\n⚠️ *ALLERGIE / SANS :* ${d.allergie}`;
  desc += `\n\n_Commande prise à ${d.heure}_`;

  try {
    if (!targetListId) await findList();
    const body = { name: titre, desc, idList: targetListId, key: API_KEY, token: TOKEN };
    const res = await fetch('https://api.trello.com/1/cards', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error();

    // Décrémenter le stock
    d.pizzas.forEach(p => {
      const idx = MENU.findIndex(m => m.name === p.name);
      if (idx >= 0) {
        MENU[idx].stock -= p.qty;
        if (MENU[idx].stock <= 5 && MENU[idx].stock > 0) {
          setTimeout(() => showToast(`⚠️ Plus que ${MENU[idx].stock} ${MENU[idx].name} !`, false, true), 500);
        }
        if (MENU[idx].stock === 0) {
          setTimeout(() => showToast(`🚨 ${MENU[idx].name} épuisée !`, false, true), 500);
        }
      }
    });

    orderCount++;
    totalCA += d.total;
    const numStr = String(orderCount).padStart(3,'0');
    historyList.unshift({ num: numStr, nom: d.nom, heure: d.heure, allergie: d.allergie, telephone: d.telephone, pizzas: d.pizzas, total: d.total });
    saveState(); saveState(); updateHeader(); renderStockBar(); updateHistory(); resetForm(); closeConfirm();
    showToast(`✓ #${numStr} · ${d.nom} — ${d.total}€`);
  } catch(e) {
    showToast('Erreur réseau — vérifie ta connexion', false, true);
  }
  btn.disabled = false; lbl.style.display = ''; spn.classList.remove('show');
}

function updateHeader() {
  document.getElementById('cmd-count').textContent = `${orderCount} cmd`;
  document.getElementById('ca-total').textContent = `${totalCA} €`;
}

function updateHistory() {
  const el = document.getElementById('history-list');
  document.getElementById('history-total').textContent = `${totalCA} €`;
  if (!historyList.length) { el.innerHTML = '<div style="font-size:0.7rem;color:var(--muted);padding:0.5rem 0;">Aucune commande pour l\'instant.</div>'; return; }
  el.innerHTML = historyList.map((h, i) => `
    <div class="history-item">
      <div class="h-left">
        <span class="h-num">#${h.num}</span>
        <span class="h-name">${h.nom}</span>
        ${h.allergie ? '<span class="h-allergy">⚠️</span>' : ''}
      </div>
      <div class="h-right">
        <span class="h-amount">${h.total}€</span>
        <span class="h-time">${h.heure}</span>
        <button class="sms-btn ${h.telephone ? '' : 'no-phone'}" onclick="sendSms(historyList[${i}])">📱</button>
      </div>
    </div>`).join('');
}

function sendSms(h) {
  if (!h.telephone) return;
  const tel = h.telephone.replace(/\s/g, '');
  const pizzaStr = h.pizzas.map(p => p.qty > 1 ? `${p.qty}x ${p.name}` : p.name).join(' + ');
  const msg = encodeURIComponent(`Bonjour ${h.nom} ! Votre pizza ${pizzaStr} est prête 🍕 — Pizza des Tontons`);
  window.location.href = `sms:${tel}?body=${msg}`;
}

function resetForm() {
  document.getElementById('nom').value = '';
  document.getElementById('heure').value = getNow();
  document.getElementById('telephone').value = '';
  allergyOn = false;
  document.getElementById('allergy-switch').classList.remove('on');
  document.getElementById('allergy-field').classList.remove('show');
  document.getElementById('allergy-toggle-label').textContent = 'Aucune allergie';
  document.getElementById('allergie').value = '';
  selectPay('CB');
  qty = MENU.map(() => 0);
  renderGrid();
  setTimeout(() => document.getElementById('nom').focus(), 100);
}

function resetService() {
  if (!confirm('Réinitialiser le service complet (stocks, commandes, CA) ?')) return;
  MENU[0].stock = 60; MENU[1].stock = 20; MENU[2].stock = 40;
  orderCount = 0; totalCA = 0; historyList = [];
  saveState(); updateHeader(); renderStockBar(); updateHistory(); resetForm();
}

function showToast(msg, ok = true, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (error ? ' error' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ---- SAUVEGARDE localStorage ----
function saveState() {
  try {
    localStorage.setItem('tontons_stock', JSON.stringify(MENU.map(m => m.stock)));
    localStorage.setItem('tontons_orderCount', orderCount);
    localStorage.setItem('tontons_totalCA', totalCA);
    localStorage.setItem('tontons_history', JSON.stringify(historyList));
  } catch(e) {}
}

function loadState() {
  try {
    const stocks = JSON.parse(localStorage.getItem('tontons_stock'));
    if (stocks && stocks.length === MENU.length) {
      stocks.forEach((s, i) => { MENU[i].stock = s; });
    }
    const oc = localStorage.getItem('tontons_orderCount');
    if (oc !== null) orderCount = parseInt(oc);
    const ca = localStorage.getItem('tontons_totalCA');
    if (ca !== null) totalCA = parseInt(ca);
    const hist = localStorage.getItem('tontons_history');
    if (hist) historyList = JSON.parse(hist);
  } catch(e) {}
}

// Init
loadState();
updateHeader();
updateHistory();
renderStockBar();
renderGrid();
</script>
</body>
</html>
